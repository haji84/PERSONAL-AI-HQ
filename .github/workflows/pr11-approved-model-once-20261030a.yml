name: PR11 owner approved models once 20261030a
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr11-approved-model-once-20261030a.yml
permissions:
  contents: read
concurrency:
  group: pr11-approved-model-once-20261030a
  cancel-in-progress: false
jobs:
  approved-once:
    if: >-
      github.repository == 'haji84/PERSONAL-AI-HQ' &&
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/autonomous-manager-bootstrap' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout only approved frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fce60149a1602e48efdfd56d37a3fbd4e4f58bcb
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify frozen source and single-run boundary
        run: |
          test "$(git rev-parse HEAD)" = "fce60149a1602e48efdfd56d37a3fbd4e4f58bcb"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s  %s\n' cf7610e7b34a54289460397563d4f4d81630c0bd80ec65ec5ee92fdc58172e32 scripts/approved-model-once-20261030.mjs | sha256sum --check --status
          node --check scripts/approved-model-once-20261030.mjs
      - name: Install pinned test dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve and run original safety tests on frozen source
        run: node --test tests/*.test.mjs
      - name: Verify public runtime and both model digests
        id: models
        run: python3 -I -S scripts/prepare-model-probe.py --prepare
      - name: Qwen once then SmolLM2 once with local checkpoint verification
        env:
          HQ_APPROVED_SOURCE_SHA: fce60149a1602e48efdfd56d37a3fbd4e4f58bcb
          HQ_PROBE_RUNTIME_DIR: ${{ steps.models.outputs.runtime_dir }}
          HQ_PROBE_BUILDER_FILE: ${{ steps.models.outputs.builder_file }}
          HQ_PROBE_REVIEWER_FILE: ${{ steps.models.outputs.reviewer_file }}
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            HQ_APPROVED_SOURCE_SHA="$HQ_APPROVED_SOURCE_SHA" \
            HQ_PROBE_RUNTIME_DIR="$HQ_PROBE_RUNTIME_DIR" \
            HQ_PROBE_BUILDER_FILE="$HQ_PROBE_BUILDER_FILE" \
            HQ_PROBE_REVIEWER_FILE="$HQ_PROBE_REVIEWER_FILE" \
            node scripts/approved-model-once-20261030.mjs
