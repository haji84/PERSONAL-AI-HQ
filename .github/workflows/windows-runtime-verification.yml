name: Windows runtime verification

"on":
  push:
    branches:
      - codex/windows-runtime-acceptance-20261128

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Report the tested Windows runtime and source
        run: |
          node -e "if (process.platform !== 'win32') process.exit(1); console.log(process.platform, process.arch, process.version)"
          git rev-parse HEAD
          git rev-parse HEAD:app
          git rev-parse HEAD:public
      - name: Install the locked public dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the application regression suite
        run: npm test
