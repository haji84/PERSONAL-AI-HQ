name: Public repository security gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scanner
        run: node --test tests/secret-guard.test.mjs
      - name: Scan tracked repository files
        run: node scripts/secret-guard.mjs
