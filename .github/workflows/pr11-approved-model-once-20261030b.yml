name: PR11 owner approved models once 20261030b
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr11-approved-model-once-20261030b.yml
permissions:
  contents: read
concurrency:
  group: pr11-approved-model-once-20261030b
  cancel-in-progress: false
jobs:
  approved-once:
    if: >-
      github.repository == 'haji84/PERSONAL-AI-HQ' &&
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/autonomous-manager-bootstrap' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout frozen approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: efe57adcb5c90cf12735964362a6635cbcd605b5
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify frozen HEAD and single-run identity
        run: |
          test "$(git rev-parse HEAD)" = "efe57adcb5c90cf12735964362a6635cbcd605b5"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          node --check scripts/approved-model-once-20261030b.mjs
      - name: Install pinned test dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run existing immutable security and synthetic tests
        run: node --test tests/*.test.mjs
      - name: Fetch and SHA-verify public model artifacts
        id: models
        run: python3 -I -S scripts/prepare-model-probe.py --prepare
      - name: Execute one Qwen and conditionally one SmolLM2
        env:
          HQ_APPROVED_SOURCE_SHA: efe57adcb5c90cf12735964362a6635cbcd605b5
          HQ_PROBE_RUNTIME_DIR: ${{ steps.models.outputs.runtime_dir }}
          HQ_PROBE_BUILDER_FILE: ${{ steps.models.outputs.builder_file }}
          HQ_PROBE_REVIEWER_FILE: ${{ steps.models.outputs.reviewer_file }}
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            HQ_APPROVED_SOURCE_SHA="$HQ_APPROVED_SOURCE_SHA" \
            HQ_PROBE_RUNTIME_DIR="$HQ_PROBE_RUNTIME_DIR" \
            HQ_PROBE_BUILDER_FILE="$HQ_PROBE_BUILDER_FILE" \
            HQ_PROBE_REVIEWER_FILE="$HQ_PROBE_REVIEWER_FILE" \
            node scripts/approved-model-once-20261030b.mjs
