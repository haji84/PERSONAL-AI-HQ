name: One-shot verified local models (public synthetic only)
# A narrow read-only experiment. No model weights or traces are uploaded.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/model-probe-readonly.yml
permissions:
  contents: read
jobs:
  pinned-model-probe:
    if: ${{ github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/autonomous-manager-bootstrap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Public synthetic scope only
        run: |
          test "${{ github.event.pull_request.number }}" = "11"
          test ! -n "${HQ_MODEL_TOKEN:-}"
          python3 -I -S scripts/prepare-model-probe.py --manifest > /dev/null
      - name: Download and verify three pinned public artifacts
        id: models
        run: python3 -I -S scripts/prepare-model-probe.py --prepare
      - name: Run actual cached Qwen and SmolLM2 under read-only BLOCKED gate
        env:
          HQ_PROBE_RUNTIME_DIR: ${{ steps.models.outputs.runtime_dir }}
          HQ_PROBE_BUILDER_FILE: ${{ steps.models.outputs.builder_file }}
          HQ_PROBE_REVIEWER_FILE: ${{ steps.models.outputs.reviewer_file }}
        run: node scripts/run-local-model-probe.mjs
